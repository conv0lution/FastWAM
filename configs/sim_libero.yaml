# @package _global_

defaults:
  - train
  - override /task: libero_uncond_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  task_ids: null
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  compile_action_infer: true

  # Optional external inputs
  dataset_stats_path: null
  device: cuda
  text_encoder_device: null

ASRE_DIAGNOSIS:
  enabled: false
  mode: drop_video_kv
  disabled_video_layers: []
  condition_name: baseline
  condition_index: null
  save_action_trace: true
  save_rollout_video: false
  state_bank_dir: null
  max_states_per_episode: 5
  offline_output_dir: null
  smoke_report_path: null

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
