# @package _global_

defaults:
  - train
  - override /task: robotwin_uncond_3cam_384_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  robotwin_root: third_party/RoboTwin
  policy_name: fastwam_policy
  task_name: null
  task_config: demo_randomized
  instruction_type: unseen
  eval_num_episodes: 100
  output_dir: ./evaluate_results/robotwin/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Action inference
  action_horizon: null
  replan_steps: 24
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  timing_enabled: false
  skip_get_obs_within_replan: true

  # Runtime inputs
  dataset_stats_path: null
  device: cuda
  # Optional local CUDA ordinals after CUDA_VISIBLE_DEVICES reordering.
  # The formal two-GPU runner supplies these through environment variables so
  # the policy and UMT5/Warp allocations do not contend on one device.
  text_encoder_device: ${oc.env:FASTWAM_TEXT_ENCODER_DEVICE,null}
  simulator_cuda_device: ${oc.env:FASTWAM_SIMULATOR_CUDA_DEVICE,null}
  # Explicit SAPIEN/Vulkan device alias, e.g. pci:0000:81:00.0.
  # CUDA_VISIBLE_DEVICES alone does not constrain the renderer.
  render_device: null
  minibench_condition: null
  seed_manifest_path: null

MULTIRUN:
  enabled: false
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
